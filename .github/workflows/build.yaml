name: Build

on:
  workflow_run:
    workflows: ["Test"]
    types: [completed]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: openjdk
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - run: ./gradlew assemble
